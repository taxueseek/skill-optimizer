<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Skill Optimizer</title>
  <desc id="desc">三条能跑起来的 Skill 工程流水线：Grok Build、Kimi Code、MiMo Code，打包前共用验证门。</desc>

  <rect width="1200" height="340" rx="24" fill="#111111"/>
  <rect x="1" y="1" width="1198" height="338" rx="23" fill="none" stroke="#2A2A2A"/>

  <g id="title-block" transform="translate(52 44)">
    <text x="0" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#D0D0D0" letter-spacing="2.4">SKILL ENGINEERING · THREE LANES</text>
    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="44" font-weight="700" fill="#F5F5F2">Skill Optimizer</text>
    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" fill="#C8C8C2">写完还能证明它好用。三条能跑的流水线。</text>
    <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="15" fill="#8A8A86">Grok Build · Kimi Code · MiMo Code · 共享验证门</text>

    <g transform="translate(0 186)" font-family="ui-monospace, Menlo, monospace" font-size="12">
      <rect width="108" height="30" rx="6" fill="#F5F5F2"/>
      <text x="54" y="20" text-anchor="middle" fill="#111111">v1.1.1</text>
      <rect x="120" width="148" height="30" rx="6" fill="#1A1A1A" stroke="#333"/>
      <text x="194" y="20" text-anchor="middle" fill="#D0D0D0">Three Gates</text>
      <rect x="280" width="148" height="30" rx="6" fill="#1A1A1A" stroke="#333"/>
      <text x="354" y="20" text-anchor="middle" fill="#D0D0D0">prove_skill.py</text>
    </g>
  </g>

  <g id="project-proof" transform="translate(620 36)">
    <rect width="528" height="268" rx="14" fill="#191919" stroke="#2E2E2E"/>
    <text x="24" y="36" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#8A8A86">PIPELINE</text>

    <g transform="translate(24 58)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">
      <rect width="148" height="54" rx="8" fill="#111111" stroke="#3A3A3A"/>
      <text x="16" y="22" fill="#8A8A86" font-size="11">GATE 1</text>
      <text x="16" y="40" fill="#F5F5F2">没有它更差吗</text>
      <rect x="164" width="148" height="54" rx="8" fill="#111111" stroke="#3A3A3A"/>
      <text x="180" y="22" fill="#8A8A86" font-size="11">GATE 2</text>
      <text x="180" y="40" fill="#F5F5F2">会用超过五次吗</text>
      <rect x="328" width="148" height="54" rx="8" fill="#111111" stroke="#3A3A3A"/>
      <text x="344" y="22" fill="#8A8A86" font-size="11">GATE 3</text>
      <text x="344" y="40" fill="#F5F5F2">Agent 本身就会吗</text>
    </g>

    <g transform="translate(24 140)" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#C8C8C2">
      <text x="0" y="18">Write</text>
      <text x="62" y="18" fill="#555">→</text>
      <text x="86" y="18">Smoke</text>
      <text x="148" y="18" fill="#555">→</text>
      <text x="172" y="18">Eval</text>
      <text x="220" y="18" fill="#555">→</text>
      <text x="244" y="18">Optimize</text>
      <text x="326" y="18" fill="#555">→</text>
      <text x="350" y="18" fill="#F5F5F2">Verify</text>
      <text x="414" y="18" fill="#555">→</text>
      <text x="438" y="18">Package</text>
    </g>

    <g transform="translate(24 196)" font-family="ui-monospace, Menlo, monospace" font-size="12">
      <rect width="148" height="40" rx="8" fill="#111111" stroke="#444"/>
      <text x="74" y="25" text-anchor="middle" fill="#F5F5F2">Grok</text>
      <rect x="164" width="148" height="40" rx="8" fill="#111111" stroke="#444"/>
      <text x="238" y="25" text-anchor="middle" fill="#F5F5F2">Kimi</text>
      <rect x="328" width="148" height="40" rx="8" fill="#111111" stroke="#444"/>
      <text x="402" y="25" text-anchor="middle" fill="#F5F5F2">MiMo</text>
    </g>
  </g>
</svg>
